<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeng-zai Tarot Generator for Choir Campaign</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="./main.css">
</head>
<body>
  <header class="justify-content-center pt-3 px-3 mb-4 border-bottom">
    <ul class="nav nav-pills gap-3 pb-3 d-flex justify-content-center align-items-center">
      <li id="nav-idona" class="nav-item"><a href="?idona" class="nav-link">Idona</a></li>
      <li id="nav-asmus" class="nav-item"><a href="?asmus" class="nav-link">Asmus</a></li>
      <li id="nav-stel" class="nav-item"><a href="?stel" class="nav-link">Stel</a></li>
      <li id="nav-nizari" class="nav-item"><a href="?nizari" class="nav-link">Nizari</a></li>
      <li id="nav-veras" class="nav-item"><a href="?veras" class="nav-link">Veras</a></li>
      <li id="nav-attra" class="nav-item"><a href="?attra" class="nav-link">Attra</a></li>
      <li id="nav-ralis" class="nav-item"><a href="?ralis" class="nav-link">Ralis</a></li>
    </ul>
    <p id="short" class="col-12 text-center"></p>
  </header>

  <div class="container">
    <div class="row">
      <div class="col border col-md-6 col-12 pb-3" style="min-width:455px">
        <h1 id="faction" style="position: sticky; top: 0px">Spread</h1>
        <button id="drawButton" type="button" class="btn btn-primary mb-2" style="position:sticky; top:50px" onclick="placeCard()">Draw Card</button>
        <button id="printButton" type="button" class="btn btn-secondary mb-2" style="position:sticky; top:50px" onclick="window.print()">Print Reading</button>
        <div id="spread" class="sticky">
          <img id="spreadImage" src="./images/asmus.png" alt="spread layout" width="430px" onclick="placeCard()" style="cursor:pointer">
        </div>  
      </div>
      <div class="col border">
        <h2>Reading</h2>
        <ul id="reading">
        </ul>
      </div>  
    </div>
  </div>

  <footer>
    © Rowan <span id="year">2025</span>
  </footer>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="./index.js"></script>
</body>
</html>
