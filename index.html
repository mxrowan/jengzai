<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/main.css">
</head>
<body>
  <h1>Tarot Generator</h1>
  <div class="d-flex flex-column flex-md-row p-4 gap-4 py-md-5 align-items-center justify-content-center">
    <h2>Faction Select</h2>
    <form id="factionSelector" class="list-group">
      <!--JS generates list-->
      <input id="factionSubmit" class="btn btn-primary" type="button" name="factionSelect" value="Generate Reading">
    </form>
  </div>
  <div class="m-2 p-4 gap-4 align-items-center justify-content-center border border-dark">
    <h2>Reading</h2>
    <h3 id="faction">Faction</h3>
    <p id="short">Short description</p>
    <p id="long" class="long-description">Long description</p>
    <ul id="spread">
      <!--JS generates spreads-->
    </ul>
  </div>
  <footer>
    © Rowan <span id="year">2025</span>
  </footer>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script> 
  <script src="./index.js"></script>
</body>
</html>
